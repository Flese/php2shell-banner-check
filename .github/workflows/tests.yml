name: Unit tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.10', '3.11', '3.12', '3.13', '3.14']

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run tests without scanning external systems
        run: python -m unittest -v test_php2shell_scanner.py

      - name: Check CLI and syntax
        run: |
          python php2shell_scanner.py --help
          python -m py_compile php2shell_scanner.py
